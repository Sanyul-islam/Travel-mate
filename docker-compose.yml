version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbit_trail_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/travel_mate
      - JWT_ACCESS_SECRET=travel_mate_access_secret_super_secure_key_2026
      - JWT_REFRESH_SECRET=travel_mate_refresh_secret_super_secure_key_2026
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: orbit_trail_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
